name: Update dependencies

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'usercao/vite-oxc-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - run: corepack enable
      - id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - run: yarn install --immutable

      - name: Upgrade dependencies
        run: |
          node --input-type=module --eval '
            import { spawnSync } from "node:child_process"
            import { readFile } from "node:fs/promises"

            const packageJson = JSON.parse(await readFile("package.json", "utf8"))
            const dependencies = [
              ...new Set([
                ...Object.keys(packageJson.dependencies ?? {}),
                ...Object.keys(packageJson.devDependencies ?? {}),
              ]),
            ]
            if (dependencies.length === 0) {
              process.exit(0)
            }

            const result = spawnSync("yarn", ["up", "--no-time-gate", ...dependencies], {
              stdio: "inherit",
            })
            process.exit(result.status ?? 1)
          '

      - name: Stop if no dependency changes
        id: changes
        run: |
          if git diff --quiet -- package.json yarn.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates are available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Dependency updates are available." >> "$GITHUB_STEP_SUMMARY"

      - if: steps.changes.outputs.changed == 'true'
        run: yarn format

      - if: steps.changes.outputs.changed == 'true'
        run: yarn check

      - if: steps.changes.outputs.changed == 'true'
        name: Commit and push updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json yarn.lock
          git add -u
          git commit -m 'chore: upgrade dependencies'
          git push
